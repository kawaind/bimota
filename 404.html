<!DOCTYPE html>
<html>

<head>
  <title>Page not found</title>
  <script type="text/javascript">
    window.isErrorPage = true;
    window.errorCode = '404';
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:title" content="Page not found">
  <script src="/scripts/scripts.js" type="module"></script>
  <script type="module">
    import { sampleRUM, getRootPath } from '/scripts/aem.js';
    import { loadFragment } from '/blocks/fragment/fragment.js';

    sampleRUM('404', { source: document.referrer });

    const rootPath = getRootPath();
    const pathTokens = window.location.pathname.split('/');
    if (pathTokens.length >= 3) {
      document.documentElement.lang = pathTokens[2].split('-')[0];
    }

    async function load404Fragment() {
      const main = document.querySelector('main');
      let fragment = null;

      if (rootPath) {
        fragment = await loadFragment(`${rootPath}/fragments/404`);
      }

      if (!fragment) {
        fragment = await loadFragment('/fragments/404');
      }

      if (fragment) {
        main.innerHTML = '';
        main.append(...fragment.childNodes);
      }
    }

    load404Fragment();
  </script>
  <link rel="stylesheet" href="/styles/styles.css">
  <style>
    main.error {
      min-height: calc(100vh - var(--nav-height));
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
  <link rel="stylesheet" href="/styles/lazy-styles.css">
</head>

<body>
  <header></header>
  <main class="error">
    <div class="section">
      <h2 class="error-message">Page Not Found</h2>
    </div>
  </main>
  <footer></footer>
</body>

</html>
